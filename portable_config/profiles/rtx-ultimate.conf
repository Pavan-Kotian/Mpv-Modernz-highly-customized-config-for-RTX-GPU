# MPV ModernZ RTX Ultimate v2
# Optional performance/quality profiles for NVIDIA RTX hardware.
# These profiles are intentionally conservative: they do not force expensive shaders.

[RTX-Performance]
profile-desc=RTX Performance - low GPU processing overhead
interpolation=no
video-sync=audio
gpu-shader-cache=yes

gpu-api=vulkan
hwdec=nvdec

[RTX-Balanced]
profile-desc=RTX Balanced - everyday 1080p/1440p playback
interpolation=yes
video-sync=audio
tscale=oversample
tscale-blur=0.9
tscale-radius=1.0

gpu-api=vulkan
hwdec=nvdec

[RTX-Quality]
profile-desc=RTX Quality - high quality scaling without forced neural shaders
interpolation=yes
video-sync=audio
tscale=oversample
tscale-blur=0.9
tscale-radius=1.0
dither-depth=auto
temporal-dither=yes
dither=error-diffusion
error-diffusion=atkinson

gpu-api=vulkan
hwdec=nvdec

[RTX-Extreme]
profile-desc=RTX Extreme - manual benchmark mode
interpolation=yes
video-sync=audio

gpu-api=vulkan
hwdec=nvdec

[144Hz-Safe]
profile-desc=144 Hz safe synchronization
interpolation=yes
video-sync=audio

[144Hz-Resample]
profile-desc=144 Hz display-resample synchronization
interpolation=yes
video-sync=display-resample

[Cache-512M]
profile-desc=Small streaming cache
demuxer-max-bytes=512M
demuxer-max-back-bytes=128M

[Cache-2G]
profile-desc=Medium streaming cache
demuxer-max-bytes=2G
demuxer-max-back-bytes=256M

[Cache-10G]
profile-desc=Large streaming cache
demuxer-max-bytes=10G
demuxer-max-back-bytes=512M

[HDR-Quality]
profile-desc=Explicit HDR quality mode
target-colorspace-hint=yes
target-prim=auto
target-trc=auto
tone-mapping=auto
hdr-compute-peak=yes
hdr-peak-percentile=99.95
hdr-contrast-recovery=0.30
gamut-mapping-mode=auto

[HDR-SDR]
profile-desc=HDR to SDR conversion
icc-profile-auto=no
target-colorspace-hint=no
target-prim=bt.709
target-trc=bt.1886
tone-mapping=bt.2390
inverse-tone-mapping=no
hdr-compute-peak=yes
gamut-mapping-mode=perceptual
