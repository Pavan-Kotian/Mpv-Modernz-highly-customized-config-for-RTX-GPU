# ModernX configuration for Pavan-Kotian's RTX 4050 mpv build
# Based on the current zydezu/ModernX options; playback settings remain in mpv.conf.

language=en
font=mpv-osd-symbols
layout_option=original
idle_screen=yes
key_bindings=yes
window_top_bar=auto
show_windowed=yes
show_fullscreen=yes
show_on_pause=yes
keep_on_pause=no
visibility=auto

hide_timeout=1500
seek_resets_hide_timeout=yes
fade_duration=150
min_mouse_move=0
bottom_hover=yes
bottom_hover_zone=175
osc_on_seek=no
osc_keep_with_cursor=no
mouse_seek_pause=yes
vid_scale=no
scale_windowed=1.0
scale_fullscreen=1.0
scale_forced_window=1.0

show_title=yes
title=${media-title}
title_font_size=28
dynamic_title=yes
show_chapter_title=yes
chapter_fmt=%s
chapter_hover_title=no
chapter_hover_subtitle=yes
show_chapter_markers=yes
chapter_marker_style=gap
time_total=yes
time_ms=no
unicode_minus=no
time_format=dynamic
time_font_size=18
show_description=yes
show_file_size=yes
description_font_size=19
description_alpha=100
scrolling_speed=40
date_format=%Y-%m-%d

window_title=yes
window_controls=yes
window_controls_title=${media-title}
raise_subtitles=yes
raise_subtitle_amount=160

compact_mode=yes
jump_buttons=yes
jump_amount=10
jump_more_amount=60
jump_icon_number=yes
jump_mode=relative
jump_softrepeat=yes
chapter_skip_buttons=yes
chapter_softrepeat=no
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=linear
info_button=yes
ontop_button=yes
screenshot_button=no
download_button=yes
download_path=~/Pictures/mpv/
loop_button=yes
loop_in_pause=yes
playpause_size=30
midbuttons_size=24
sidebuttons_size=24

osc_color=#000000
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
title_color=#FFFFFF
seekbarfg_color=#FF8232
seekbarbg_color=#777777
seekbar_cache_color=#555555
volumebar_match_seek_color=no
time_color=#FFFFFF
chapter_title_color=#FFFFFF
chapter_marker_color=#FF8232
chapter_marker_current_color=#9D96F5
side_buttons_color=#FFFFFF
middle_buttons_color=#FFFFFF
playpause_color=#FFFFFF
held_element_color=#999999
hover_effect_color=#FFFFFF

fade_alpha=100
fade_blur_strength=75
fade_transparency_strength=0
window_fade_alpha=100
window_fade_blur_strength=75
window_fade_transparency_strength=0
thumbnail_border=1
thumbnail_border_radius=5

hover_effect=size,glow,color
hover_button_size=115
button_glow_amount=5
hover_effect_for_sliders=no

seek_handle_size=0.8
seekbar_between_timers=no
seekbar_height=2
progress_bar_height=16
seek_range=yes
seek_range_alpha=175
seekbar_keyframes=yes
automatic_keyframe_mode=yes
automatic_keyframe_limit=1800
persistent_progress_default=no
persistent_progress_height=17
persistent_buffer=no
persistent_progress_toggle=yes

title_youtube_stats=yes
ytdl_format=
show_sponsorblock_segments=no
add_sponsorblock_chapters=no
show_youtube_comments=no
FORCE_fix_not_ontop=yes
