SPACE cycle pause
TAB script-message-to modernz osc-visibility cycle #@press
TAB script-message-to modernz osc-visibility cycle #@release
INSERT script-message rtx-diagnostics
MBTN_LEFT cycle pause

U cycle sub
; playlist-prev
' playlist-next
d cycle deband
ALT+v script-binding autosub/download_subs
MOUSE_BTN2 script-binding select/menu
ALT+a script-binding select/menu
ALT+z script-binding select/select-aid
ALT+x script-binding select/select-sid
ALT+s script-binding select/menu

### ModernZ Menu / RTX Ultimate Config ###

# script-binding select/select-playlist                                                        #! File > Playlist
# script-binding select/select-chapter                                                        #! File > Chapters
# script-binding uosc editions                                                                #! File > Editions
b script-binding open-file                                                                    #! File > Open File
# script-binding uosc/load-subtitles                                                          #! File > Open Subtitles
h script-binding memo-history                                                                  #! File > Recently Played

g cycle interpolation                                                                          #! Video > Toggle Interpolation
D script-binding autodeint/autodeint                                                           #! Video > Filters > Deinterlace
# apply-profile Deband-Medium                                                                  #! Video > Filters > Deband (Medium)
# apply-profile Deband-Strong                                                                  #! Video > Filters > Deband (Strong)
ALT+d vf toggle deblock=filter=weak:block=4                                                    #! Video > Filters > Toggle Deblocking
n change-list glsl-shaders toggle ~~/shaders/nlmeans_luma.glsl                                 #! Video > Shaders > Denoise

CTRL+1 apply-profile FSRCNNX;show-text "Profile: FSRCNNX"
CTRL+2 apply-profile FSRCNNX+;show-text "Profile: FSRCNNX+"
CTRL+3 apply-profile Ravu-Zoom;show-text "Profile: Ravu-Zoom"
CTRL+4 apply-profile Ani4k;show-text "Profile: Ani4k"
CTRL+5 apply-profile AniSD;show-text "Profile: AniSD"
CTRL+6 apply-profile Anime4K;show-text "Profile: Anime4K"
CTRL+7 apply-profile NNEDI3;show-text "Profile: NNEDI3"
CTRL+8 apply-profile NNEDI3+;show-text "Profile: NNEDI3+"

# RTX Ultimate modes
CTRL+ALT+1 apply-profile RTX-Performance;show-text "RTX Mode: Performance"
CTRL+ALT+2 apply-profile RTX-Balanced;show-text "RTX Mode: Balanced"
CTRL+ALT+3 apply-profile RTX-Quality;show-text "RTX Mode: Quality"
CTRL+ALT+4 apply-profile RTX-Extreme;show-text "RTX Mode: Extreme"
CTRL+ALT+5 apply-profile 144Hz-Safe;show-text "Sync: 144Hz Safe"
CTRL+ALT+6 apply-profile 144Hz-Resample;show-text "Sync: 144Hz Resample"
CTRL+ALT+7 apply-profile Cache-512M;show-text "Cache: 512 MB"
CTRL+ALT+8 apply-profile Cache-2G;show-text "Cache: 2 GB"
CTRL+ALT+9 apply-profile Cache-10G;show-text "Cache: 10 GB"
CTRL+ALT+0 script-message rtx-diagnostics

c change-list glsl-shaders clr all                                                               #! Video > Shaders > Clear All

ALT+c af clr ""                                                                                #! Audio > Clear Filters
v script-binding afilter/toggle-snm                                                             #! Audio > Speech Normaliser
S script-binding afilter/toggle-sfa                                                             #! Audio > HRTF Surround Sound

F add sub-scale +0.05                                                                           #! Subtitles > Bigger
G add sub-scale -0.05                                                                           #! Subtitles > Smaller
z add sub-delay -0.1                                                                            #! Subtitles > Decrease Sub Delay
x add sub-delay 0.1                                                                             #! Subtitles > Increase Sub Delay

i script-binding stats/display-stats-toggle                                                     #! Miscellaneous > Stats
/ script-binding console/enable                                                                 #! Miscellaneous > Console
a cycle window-minimized                                                                        #! Miscellaneous > Minimise
q quit-watch-later                                                                              #! Miscellaneous > Exit
